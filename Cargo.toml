[package]
name = "glimpse_launcher"
version = "0.8.1"
edition = "2021"
description = "An ultralight, blazing-fast desktop launcher for Windows 11"
repository = "https://github.com/devfreitas/GlimpseLauncher"
license = "MIT"

[features]
default = ["use_mimalloc"]
use_mimalloc = ["mimalloc"]

[dependencies]
# GUI & system
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow"] }
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
walkdir = "2.4.0"
crossbeam-channel = "0.5.8"
tray-icon = "0.14.3"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
image = "0.24.7"
once_cell = "1.19"
mimalloc = { version = "0.1", optional = true }
winreg = "0.10"
bincode = "2"
toml = "0.8"
egui-phosphor = "0.5.0"
interprocess = "2.4.2"
webbrowser = "1.2.1"
urlencoding = "2.1.3"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
nucleo-matcher = "0.3.1"
evalexpr = "13.1.0"

[dependencies.windows]
version = "0.52.0"
features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
