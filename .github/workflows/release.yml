name: Release

on:
  push:
    tags:
      - 'v*' # Aciona quando uma tag como v1.0.0, v0.8.0, etc é criada

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write # Necessário para criar a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Rename executable
        run: |
          Rename-Item -Path "target\release\glimpse_launcher.exe" -NewName "GlimpseLauncher.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target\release\GlimpseLauncher.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
