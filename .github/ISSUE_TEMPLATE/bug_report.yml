name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Glimpse Launcher
        2. Type '...'
        3. Press Enter
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version
      description: e.g., Windows 11 23H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glimpse Launcher Version
      description: e.g., 0.6.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or logs.
